<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Giriş Yap – Halı & Koltuk Yıkama Sistemi</title>
    <meta name="description" content="Çoklu Firma ve Sürücü Giriş Portalı">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" id="pwaManifest" href="/manifest.json">
    <link rel="apple-touch-icon" id="pwaAppleIcon" href="/icons/icon-office-192.png">

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts – Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-primary: 'Inter', system-ui, -apple-system, sans-serif;
            --clr-bg: #0f172a;
            --clr-surface: #1e293b;
            --clr-surface-card: rgba(30, 41, 59, 0.9);
            --clr-text-primary: #f8fafc;
            --clr-text-muted: #94a3b8;
            --clr-border: #334155;
            --clr-accent-company: #8b5cf6;
            --clr-accent-company-hover: #7c3aed;
            --clr-accent-driver: #10b981;
            --clr-accent-driver-hover: #059669;
            --radius-md: 14px;
            --radius-lg: 20px;
            --shadow-card: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-primary);
            background: radial-gradient(circle at 10% 20%, #1e1b4b 0%, #0f172a 70%);
            color: var(--clr-text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 70%);
            bottom: -100px;
            left: -100px;
            pointer-events: none;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--clr-surface-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--clr-border);
            border-radius: var(--radius-lg);
            padding: 2.25rem 2rem;
            box-shadow: var(--shadow-card);
            position: relative;
            z-index: 1;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #fff;
            margin-bottom: 1rem;
            box-shadow: 0 10px 20px -5px rgba(139, 92, 246, 0.4);
        }

        .brand-title {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #fff;
            margin-bottom: 0.35rem;
        }

        .brand-subtitle {
            font-size: 0.88rem;
            color: var(--clr-text-muted);
        }

        /* Tabs */
        .tab-switcher {
            display: flex;
            background: rgba(15, 23, 42, 0.6);
            padding: 4px;
            border-radius: var(--radius-md);
            margin-bottom: 1.75rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--clr-text-muted);
            padding: 10px 12px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active.tab-company {
            background: var(--clr-accent-company);
            color: #fff;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.35);
        }

        .tab-btn.active.tab-driver {
            background: var(--clr-accent-driver);
            color: #fff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
        }

        /* Form elements */
        .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.4rem;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 1.25rem;
        }

        .input-group-custom .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1.05rem;
            pointer-events: none;
            transition: color 0.2s;
        }

        .form-control-custom {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--clr-border);
            color: #fff;
            font-size: 0.95rem;
            padding: 12px 14px 12px 42px;
            border-radius: var(--radius-md);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control-custom:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .tab-driver-active .form-control-custom:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        .driver-code-input {
            text-align: center;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding-left: 14px;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            font-size: 0.98rem;
            font-weight: 700;
            border-radius: var(--radius-md);
            border: none;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 0.5rem;
        }

        .btn-company {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
        }

        .btn-company:hover {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            transform: translateY(-1px);
        }

        .btn-driver {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
        }

        .btn-driver:hover {
            background: linear-gradient(135deg, #059669, #047857);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .alert-custom {
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            display: none;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        /* Demo credentials card */
        .demo-box {
            margin-top: 1.75rem;
            padding: 14px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px dashed #334155;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .demo-box strong {
            color: #e2e8f0;
        }

        .demo-chip {
            display: inline-block;
            background: #1e293b;
            padding: 2px 7px;
            border-radius: 6px;
            font-family: monospace;
            color: #38bdf8;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.06);
            margin: 2px 0;
        }
    </style>
</head>
<body>

    <div class="login-card" id="loginCard">
        <div class="brand-header">
            <div class="brand-icon">
                <i class="bi bi-water"></i>
            </div>
            <h1 class="brand-title">Halı & Koltuk Yıkama</h1>
            <p class="brand-subtitle">İşletme ve Sürücü Yönetim Portalı</p>
        </div>

        <!-- Hata Bildirimi -->
        <div class="alert-custom alert-error" id="errorAlert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>
            <span id="errorMessage">Hatalı giriş</span>
        </div>

        <!-- Tab Seçici -->
        <div class="tab-switcher">
            <button class="tab-btn tab-company active" id="tabCompany" onclick="switchTab('company')">
                <i class="bi bi-building"></i>
                Firma Girişi
            </button>
            <button class="tab-btn tab-driver" id="tabDriver" onclick="switchTab('driver')">
                <i class="bi bi-truck"></i>
                Sürücü Kodu
            </button>
        </div>

        <!-- 1. Firma Formu -->
        <form id="formCompany" onsubmit="handleCompanyLogin(event)">
            <div class="input-group-custom">
                <label class="form-label" for="companyEmail">E-Posta Adresi</label>
                <div style="position: relative;">
                    <i class="bi bi-envelope icon"></i>
                    <input type="email" id="companyEmail" class="form-control-custom" placeholder="ornek@haliyikama.com" required autocomplete="email">
                </div>
            </div>

            <div class="input-group-custom">
                <label class="form-label" for="companyPassword">Şifre</label>
                <div style="position: relative;">
                    <i class="bi bi-lock icon"></i>
                    <input type="password" id="companyPassword" class="form-control-custom" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-submit btn-company" id="btnCompanySubmit">
                <i class="bi bi-box-arrow-in-right"></i>
                Ofis Paneline Giriş Yap
            </button>
            <div class="text-center mt-3">
                <a href="#" onclick="toggleRegister(true); return false;" style="color:#a78bfa;font-size:0.85rem;text-decoration:none;">
                    <i class="bi bi-plus-circle me-1"></i>Yeni Firma mısınız? Hemen Kayıt Olun →
                </a>
            </div>
        </form>

        <!-- 1.5. Firma Kayıt Formu -->
        <form id="formRegister" style="display: none;" onsubmit="handleCompanyRegister(event)">
            <div class="input-group-custom">
                <label class="form-label" for="regName">Firma Adı</label>
                <div style="position: relative;">
                    <i class="bi bi-building icon"></i>
                    <input type="text" id="regName" class="form-control-custom" placeholder="Örn: Yıldız Halı Yıkama" required>
                </div>
            </div>

            <div class="input-group-custom">
                <label class="form-label" for="regEmail">E-Posta Adresi</label>
                <div style="position: relative;">
                    <i class="bi bi-envelope icon"></i>
                    <input type="email" id="regEmail" class="form-control-custom" placeholder="firma@ornek.com" required autocomplete="email">
                </div>
            </div>

            <div class="input-group-custom">
                <label class="form-label" for="regPassword">Şifre (En az 6 karakter)</label>
                <div style="position: relative;">
                    <i class="bi bi-lock icon"></i>
                    <input type="password" id="regPassword" class="form-control-custom" placeholder="••••••••" required minlength="6" autocomplete="new-password">
                </div>
            </div>

            <div class="input-group-custom">
                <label class="form-label" for="regPhone">İletişim Telefonu</label>
                <div style="position: relative;">
                    <i class="bi bi-telephone icon"></i>
                    <input type="tel" id="regPhone" class="form-control-custom" placeholder="05XX XXX XX XX" required>
                </div>
            </div>

            <div class="input-group-custom">
                <label class="form-label" for="regAddress">Adres (Opsiyonel)</label>
                <div style="position: relative;">
                    <i class="bi bi-geo-alt icon"></i>
                    <input type="text" id="regAddress" class="form-control-custom" placeholder="İl, İlçe veya Açık Adres">
                </div>
            </div>

            <div class="input-group-custom">
                <label class="form-label" for="regPrefix">Sürücü Kod Öneki (Opsiyonel)</label>
                <div style="position: relative;">
                    <i class="bi bi-tag icon"></i>
                    <input type="text" id="regPrefix" class="form-control-custom" placeholder="Örn: YLD (Boşsa otomatik)" minlength="2" maxlength="5">
                </div>
            </div>

            <button type="submit" class="btn-submit btn-company" id="btnRegisterSubmit">
                <i class="bi bi-check-circle"></i>
                Firma Hesabı Oluştur ve Başla
            </button>
            <div class="text-center mt-3">
                <a href="#" onclick="toggleRegister(false); return false;" style="color:#94a3b8;font-size:0.85rem;text-decoration:none;">
                    ← Zaten hesabınız var mı? Giriş Yapın
                </a>
            </div>
        </form>

        <!-- 2. Sürücü Formu (Şifresiz, tek kod ile) -->
        <form id="formDriver" style="display: none;" onsubmit="handleDriverLogin(event)">
            <div class="input-group-custom text-center">
                <label class="form-label" for="driverCode">Hızlı Erişim Kodu</label>
                <p class="text-muted" style="font-size: 0.8rem; margin-bottom: 0.75rem;">
                    Firmanız tarafından size iletilen kodu giriniz:
                </p>
                <input type="text" id="driverCode" class="form-control-custom driver-code-input" placeholder="DNZ-101" maxlength="15" required autocomplete="off">
            </div>

            <button type="submit" class="btn-submit btn-driver" id="btnDriverSubmit">
                <i class="bi bi-truck"></i>
                Sürücü Paneline Başla
            </button>
        </form>

        <!-- PWA Yükleme Butonu (uygun cihazlarda otomatik görünür) -->
        <button type="button" id="btnInstallPwa" onclick="installLoginPwa()" style="display:none;width:100%;margin-top:1rem;padding:10px 14px;border-radius:12px;border:1px solid rgba(148,163,184,0.25);background:rgba(15,23,42,0.55);color:#e2e8f0;font-size:0.86rem;font-weight:600;cursor:pointer;align-items:center;justify-content:center;gap:8px;">
            <i class="bi bi-phone"></i>
            <span id="btnInstallPwaLabel">Uygulamayı Ana Ekrana Yükle</span>
        </button>

        <!-- Demo Giriş Bilgileri (yalnızca yerel geliştirme ortamında gösterilir) -->
        <div class="demo-box" id="demoBox" style="display: none;">
            <div class="fw-semibold mb-1" style="color: #cbd5e1;">
                <i class="bi bi-info-circle me-1"></i>Hızlı Test Hesapları:
            </div>
            <div class="mb-1">
                <strong>Firma:</strong> <span class="demo-chip" onclick="fillCompany('deniz@haliyikama.com','Deniz123!')">deniz@haliyikama.com / Deniz123!</span>
            </div>
            <div>
                <strong>Sürücü:</strong> <span class="demo-chip" onclick="fillDriver('DNZ-101')">DNZ-101</span> (Tek tıkla giriş)
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'company';
        let isRegisterMode = false;
        const isLocalDev = ['localhost', '127.0.0.1', '[::1]'].includes(window.location.hostname);

        function updateDemoBoxVisibility() {
            const demoBox = document.getElementById('demoBox');
            if (!demoBox) return;
            demoBox.style.display = (isLocalDev && !isRegisterMode) ? 'block' : 'none';
        }

        async function parseResponseSafe(res) {
            const text = await res.text().catch(() => '');
            if (!text) return null;
            try {
                return JSON.parse(text);
            } catch {
                return null;
            }
        }

        function extractErrorFromData(data, fallbackMessage) {
            if (!data) return fallbackMessage;
            if (data.message) return data.message;
            if (data.errors && typeof data.errors === 'object') {
                const firstKey = Object.keys(data.errors)[0];
                const firstVal = firstKey ? data.errors[firstKey] : null;
                if (Array.isArray(firstVal) && firstVal.length > 0) return firstVal[0];
            }
            if (data.title) return data.title;
            return fallbackMessage;
        }

        // URL parametresi ile tab yönlendirme (?role=driver)
        window.addEventListener('DOMContentLoaded', async () => {
            updateDemoBoxVisibility();
            const urlParams = new URLSearchParams(window.location.search);
            const requestedRole = urlParams.get('role');
            if (requestedRole === 'driver') {
                switchTab('driver');
            }

            // Eski ortak anahtarları temizle
            localStorage.removeItem('hali_token');
            localStorage.removeItem('hali_user');

            // İlgili rol için halihazırda geçerli bir oturum var mı? /api/auth/me ile doğrula
            const isDriverTarget = requestedRole === 'driver';
            const tokenKey = isDriverTarget ? 'hali_driver_token' : 'hali_admin_token';
            const userKey = isDriverTarget ? 'hali_driver_user' : 'hali_admin_user';
            const token = localStorage.getItem(tokenKey);
            const userStr = localStorage.getItem(userKey);
            if (token && userStr) {
                try {
                    const res = await fetch('/api/auth/me', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const user = await res.json();
                        if (!isDriverTarget && user.role === 'CompanyAdmin') {
                            window.location.href = '/index.html';
                        } else if (isDriverTarget && user.role === 'Driver') {
                            window.location.href = '/driver.html';
                        }
                    } else {
                        localStorage.removeItem(tokenKey);
                        localStorage.removeItem(userKey);
                    }
                } catch (e) {
                    // Offline veya hata, bekle
                }
            }
        });

        function toggleRegister(show) {
            isRegisterMode = show;
            hideError();
            const formCompany = document.getElementById('formCompany');
            const formRegister = document.getElementById('formRegister');

            if (show) {
                formCompany.style.display = 'none';
                formRegister.style.display = 'block';
                document.getElementById('regName').focus();
            } else {
                formCompany.style.display = 'block';
                formRegister.style.display = 'none';
                document.getElementById('companyEmail').focus();
            }
            updateDemoBoxVisibility();
        }

        function switchTab(tab) {
            currentTab = tab;
            isRegisterMode = false;
            hideError();

            const tabCompany = document.getElementById('tabCompany');
            const tabDriver = document.getElementById('tabDriver');
            const formCompany = document.getElementById('formCompany');
            const formRegister = document.getElementById('formRegister');
            const formDriver = document.getElementById('formDriver');
            const loginCard = document.getElementById('loginCard');

            formRegister.style.display = 'none';

            if (tab === 'company') {
                tabCompany.classList.add('active');
                tabDriver.classList.remove('active');
                formCompany.style.display = 'block';
                formDriver.style.display = 'none';
                loginCard.classList.remove('tab-driver-active');
                updatePwaManifestForTab('company');
            } else {
                tabCompany.classList.remove('active');
                tabDriver.classList.add('active');
                formCompany.style.display = 'none';
                formDriver.style.display = 'block';
                loginCard.classList.add('tab-driver-active');
                updatePwaManifestForTab('driver');
                setTimeout(() => document.getElementById('driverCode').focus(), 50);
            }
            updateDemoBoxVisibility();
        }

        async function handleCompanyRegister(e) {
            e.preventDefault();
            hideError();

            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const phone = document.getElementById('regPhone').value.trim();
            const address = document.getElementById('regAddress').value.trim() || null;
            const codePrefix = document.getElementById('regPrefix').value.trim() || null;
            const btn = document.getElementById('btnRegisterSubmit');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Hesap oluşturuluyor...';

            try {
                const res = await fetch('/api/auth/company/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, phone, address, codePrefix })
                });

                const data = await parseResponseSafe(res);
                if (!res.ok) {
                    throw new Error(extractErrorFromData(data, `Kayıt işlemi başarısız oldu (${res.status}).`));
                }

                // Token ve kullanıcı verilerini sakla (ofis paneline özel anahtar)
                localStorage.setItem('hali_admin_token', data.token);
                localStorage.setItem('hali_admin_user', JSON.stringify(data));

                // Ofis paneline yönlendir
                window.location.href = '/index.html';

            } catch (err) {
                showError(err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-check-circle"></i> Firma Hesabı Oluştur ve Başla';
            }
        }

        async function handleCompanyLogin(e) {
            e.preventDefault();
            hideError();

            const email = document.getElementById('companyEmail').value.trim();
            const password = document.getElementById('companyPassword').value;
            const btn = document.getElementById('btnCompanySubmit');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Giriş yapılıyor...';

            try {
                const res = await fetch('/api/auth/company/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await parseResponseSafe(res);
                if (!res.ok) {
                    throw new Error(extractErrorFromData(data, `Giriş başarısız oldu (${res.status}).`));
                }

                // Token ve kullanıcı verilerini sakla (ofis paneline özel anahtar)
                localStorage.setItem('hali_admin_token', data.token);
                localStorage.setItem('hali_admin_user', JSON.stringify(data));

                // Ofis paneline yönlendir
                window.location.href = '/index.html';

            } catch (err) {
                showError(err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Ofis Paneline Giriş Yap';
            }
        }

        async function handleDriverLogin(e) {
            e.preventDefault();
            hideError();

            const accessCode = document.getElementById('driverCode').value.trim();
            const btn = document.getElementById('btnDriverSubmit');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Doğrulanıyor...';

            try {
                const res = await fetch('/api/auth/driver/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accessCode })
                });

                const data = await parseResponseSafe(res);
                if (!res.ok) {
                    throw new Error(extractErrorFromData(data, `Geçersiz erişim kodu (${res.status}).`));
                }

                // Kalıcı oturum: 180 gün geçerli JWT (sürücü paneline özel anahtar)
                localStorage.setItem('hali_driver_token', data.token);
                localStorage.setItem('hali_driver_user', JSON.stringify(data));

                // Sürücü paneline yönlendir
                window.location.href = '/driver.html';

            } catch (err) {
                showError(err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-truck"></i> Sürücü Paneline Başla';
            }
        }

        function showError(msg) {
            const alertEl = document.getElementById('errorAlert');
            const msgEl = document.getElementById('errorMessage');
            msgEl.textContent = msg;
            alertEl.style.display = 'block';
        }

        function hideError() {
            document.getElementById('errorAlert').style.display = 'none';
        }

        function fillCompany(email, pass) {
            switchTab('company');
            document.getElementById('companyEmail').value = email;
            document.getElementById('companyPassword').value = pass;
        }

        function fillDriver(code) {
            switchTab('driver');
            document.getElementById('driverCode').value = code;
        }

        // PWA manifest sekme eşleştirme & kurulum
        let deferredLoginPrompt = null;

        function updatePwaManifestForTab(tab) {
            const manifestEl = document.getElementById('pwaManifest');
            const appleIconEl = document.getElementById('pwaAppleIcon');
            const labelEl = document.getElementById('btnInstallPwaLabel');
            if (tab === 'driver') {
                if (manifestEl) manifestEl.setAttribute('href', '/manifest-driver.json');
                if (appleIconEl) appleIconEl.setAttribute('href', '/icons/icon-driver-192.png');
                if (labelEl) labelEl.textContent = 'Sürücü Uygulamasını Ana Ekrana Yükle';
            } else {
                if (manifestEl) manifestEl.setAttribute('href', '/manifest.json');
                if (appleIconEl) appleIconEl.setAttribute('href', '/icons/icon-office-192.png');
                if (labelEl) labelEl.textContent = 'Ofis Uygulamasını Ana Ekrana Yükle';
            }
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredLoginPrompt = e;
            const btn = document.getElementById('btnInstallPwa');
            if (btn) btn.style.display = 'flex';
        });

        window.addEventListener('appinstalled', () => {
            deferredLoginPrompt = null;
            const btn = document.getElementById('btnInstallPwa');
            if (btn) btn.style.display = 'none';
        });

        async function installLoginPwa() {
            if (!deferredLoginPrompt) return;
            deferredLoginPrompt.prompt();
            await deferredLoginPrompt.userChoice;
            deferredLoginPrompt = null;
            const btn = document.getElementById('btnInstallPwa');
            if (btn) btn.style.display = 'none';
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
